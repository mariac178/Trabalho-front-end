<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meu Jogador da Copa do Mundo </title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    
    <style> 
        body, html {
            height: 100%;
            margin: 0;
        }

        .bg-copa {
            background-image: url('img/FIFA-World-Cup-26.jpg');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .card {
            backdrop-filter: blur(5px);
            background-color: rgba(255, 255, 255, 0.9);
            border: none;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }

        /* ✅ imagem corrigida */
        .card img {
            height: 250px;
            width: 100%;
            object-fit: cover;
            object-position: top;
            border-top-left-radius: 8px;
            border-top-right-radius: 8px;
        }
    </style>
</head>

<body id="topo">

    <div class="bg-copa">
        <div class="d-flex flex-column justify-content-center">
            
            <div id="Cards" class="d-flex flex-row align-items-center">
                
                <div class="card" style="width: 22rem;">
                    <img src="img_vinicius_junior.png" class="card-img-top" alt="Vinicius Junior">

                    <div class="card-body">
                        <h5 class="card-title">
                            <span>Vini JR.</span>
                            <span class="badge text-bg-secondary">9,5</span>
                        </h5>

                        <p class="card-text">
                            <strong>Nascimento:</strong> 12/07/2000 <br>
                            <strong>Altura:</strong> 1,76 <br>
                            <strong>Posição:</strong> Ponta-esquerda / Atacante
                        </p>
                    </div>
                </div>

            </div>

            <button onclick="add()" class="btn btn-primary" style="margin: 10px; padding: 10px;">
                Adicionar Novo Jogador
            </button>

        </div>
    </div>

     <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
     <script src="scriptexc4p2.js"></script>

</body>
</html>
